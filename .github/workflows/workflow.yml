name: Build and deploy to FTP
on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [content-update]

# Serializes deploys. Two overlapping runs on 2026-07-15 both ran with
# dangerous-clean-slate and wiped the _next/ directory off the server.
# cancel-in-progress stays false on purpose: cancelling a run mid-clean-slate
# leaves the document root empty.
concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.4.0"

      - name: Install dependencies
        run: npm install
        working-directory: ./web

      - name: Build application
        run: npm run build
        working-directory: ./web
        env:
          NEXT_PUBLIC_PAYLOAD_URL: ${{secrets.NEXT_PUBLIC_PAYLOAD_URL}}

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{secrets.FTP_SERVER}}
          username: ${{secrets.FTP_USERNAME}}
          password: ${{secrets.FTP_PASSWORD}}
          local-dir: ./web/out/
          server-dir: ${{secrets.FTP_SERVER_DIR}}
          dangerous-clean-slate: true

      # The FTP action reports success even when the upload never landed.
      # Sample real _next/ assets referenced by the served HTML and fail loudly
      # if the server 404s them.
      - name: Verify deployment
        shell: bash
        env:
          SITE_URL: https://jethouse.aero
        run: |
          set -euo pipefail

          echo "Waiting for FTP writes to settle..."
          sleep 20

          html=$(curl -fsS --max-time 30 -H 'Cache-Control: no-cache' \
            "${SITE_URL}/?deploy-check=${GITHUB_RUN_ID}")

          found=()
          while IFS= read -r line; do
            [ -n "$line" ] && found+=("$line")
          done < <(
            printf '%s' "$html" \
              | grep -oE '/_next/static/[A-Za-z0-9._/-]+\.(js|css)' \
              | sort -u
          )

          if [ "${#found[@]}" -lt 3 ]; then
            echo "::error::Served HTML references only ${#found[@]} _next/ assets (expected >= 3)."
            exit 1
          fi

          assets=("${found[@]:0:3}")
          echo "Checking ${#assets[@]} of ${#found[@]} _next/ assets:"

          failed=0
          for asset in "${assets[@]}"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              -H 'Cache-Control: no-cache' "${SITE_URL}${asset}")
            if [ "$code" = "200" ]; then
              echo "  OK    $code  $asset"
            else
              echo "  FAIL  $code  $asset"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::Deployment incomplete - _next/ assets missing on the server. The site will render unstyled."
            exit 1
          fi

          echo "Deployment verified."
